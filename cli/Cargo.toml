[package]
name = "stitchr-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stitchr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
stitchr-core = { path = "../core" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
