[package]
name = "stitchr-core"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
csscolorparser = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uniffi = "=0.32.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
